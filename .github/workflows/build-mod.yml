name: Build Sistema Solar mod

on:
  push:
    branches:
      - codex/planetas-chatgpt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: sistemasolar-mod
          path: build/libs/sistemasolar-*.jar
          if-no-files-found: error
