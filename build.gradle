plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.sistemasolar'
base { archivesName = 'sistemasolar' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { solarsystem { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [mod_id: 'sistemasolar', mod_name: 'Sistema Solar', mod_license: 'MIT', mod_version: project.version,
                             minecraft_version: '1.20.1', forge_version: '47.4.28']
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
